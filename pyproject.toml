[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-auditor"
version = "0.1.0"
description = "Detectors for backtest overfitting: Deflated Sharpe Ratio, PBO via CSCV, White's Reality Check."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Monte Carlo calibration and large-S differential tests are excluded by
# default so the per-commit suite stays fast. Run them with:  pytest -m slow
addopts = "-m 'not slow'"
markers = [
    "slow: statistical calibration or large-S differential test (minutes, not seconds)",
]
